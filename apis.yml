name: Medmonk
description: Medmonk is a pharma market access platform that connects brand teams,
  healthcare providers, pharmacies, and patients on a single real-time infrastructure.
  It automates point-of-sale copay enrollment, benefit investigations, prior authorizations,
  financial assistance, hub workflows, and adherence tracking across specialty and
  rare-disease medications, reaching roughly 98% of U.S. pharmacy and buy/bill network
  connectivity. Medmonk states it exposes FHIR-compliant APIs to integrate with existing
  EHR, CRM, and pharmacy systems, and claims SOC 2, HIPAA, and GDPR compliance, though
  it publishes no public developer portal or API documentation. Founded in the Y Combinator
  W12 batch.
